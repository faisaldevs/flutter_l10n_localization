name: flutter_l10n_localization
description: "A new Flutter project."
publish_to: 'none' # Remove this line if you wish to publish to pub.dev
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

  # ✅ Added for asset/code generation
  build_runner: ^2.4.7
  flutter_gen_runner: ^5.4.0

flutter:
  uses-material-design: true

  # ✅ Enable code generation for localization, assets, etc.
  generate: true

  # Uncomment and define if you have assets
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Uncomment and define if you have custom fonts
  # fonts:
  #   - family: CustomFont
  #     fonts:
  #       - asset: assets/fonts/CustomFont-Regular.ttf
  #       - asset: assets/fonts/CustomFont-Bold.ttf
  #         weight: 700
